<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1e16"/>
      <stop offset="100%" stop-color="#120e0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  
  <!-- Background Card Shape -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="url(#gold)" stroke-width="24"/>
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="rgba(255, 215, 0, 0.4)" stroke-width="8"/>
  
  <!-- Center Playing Card Badge -->
  <g transform="translate(156, 120)">
    <rect x="0" y="0" width="200" height="270" rx="24" fill="#1d1813" stroke="url(#gold)" stroke-width="12"/>
    <text x="100" y="150" font-size="110" text-anchor="middle" dominant-baseline="central" fill="#ffd700">🎴</text>
  </g>
  
  <!-- Crossed Swords -->
  <text x="256" y="420" font-size="70" text-anchor="middle" fill="#ffd700" font-family="sans-serif">⚔️</text>
</svg>